# vpn-gateway server configuration.
#
# Validate with:  vpn-gateway-server -config config.yaml -check

# Where the client-facing control API listens. Keep this on loopback and let
# the trojan listener carry client traffic; exposing it directly would put an
# API that can reach several corporate networks on the open internet.
api_listen: 127.0.0.1:8642

state_dir: /var/lib/vpn-gateway

# docker, podman, or auto to pick whichever is installed.
runtime: auto

# When to fetch an image from its registry. Images are built elsewhere and
# pushed, so this machine fetches what it does not have.
#   missing  only what is not here (the default)
#   always   check every time a container is created, for a tag that moves
#   never    refuse rather than reaching out, for a machine with no registry
pull_policy: missing

# First loopback port handed to containers. Each tunnel takes two: one for its
# SOCKS5 data plane and one for its control plane. These are internal to the
# server; clients never see them.
port_base: 21000

# The single TLS port every client connects to. One trojan user per tunnel;
# the password a client sends is what selects which tunnel carries its
# traffic, so the server needs no routing rules of its own.
trojan:
  listen: ":443"

  # The name clients send as SNI and verify. For a home server this is
  # normally a dynamic DNS name.
  server_name: vpn.example.dyndns.org

  # selfsigned: generate a long-lived certificate on first run; clients pin
  #   its fingerprint. The default, because a home server behind NAT usually
  #   cannot answer an HTTP-01 challenge.
  # files:      use cert_file and key_file. Any ACME client with DNS-01
  #   support (certbot, lego, acme.sh) produces these, which is how to get a
  #   Let's Encrypt certificate without exposing port 80.
  tls_mode: selfsigned
  # cert_file: /etc/letsencrypt/live/vpn.example.org/fullchain.pem
  # key_file:  /etc/letsencrypt/live/vpn.example.org/privkey.pem

  log_level: warn

# User authentication for clients connecting to this server (optional).
# When configured, clients must provide a valid username and password to connect.
# Password hashes can be generated using: vgctl hash-password <password>
# Supported formats:
#   - bcrypt hash: $2a$, $2b$, or $2y$ (recommended)
#   - sha256 hex:  "sha256:<64-char hex>" or raw 64-char hex string
users:
  - username: alice
    password_hash: "$2a$10$LPi1PG0BPYrE3iCKop1L..XxmXyYJnEDxR6/DKG3nSbnj.XZRNsJK" # bcrypt for "alicepassword"
  # - username: bob
  #   password_hash: "sha256:fcf730b6d95236ecd3c9fc2d92d7b6b2bb061514961aec041d6c7a7192f592e4" # sha256 for "secret123"

# Tunnels wait to be told to dial, from the client. Every attempt is a full
# authentication against the gateway, and a server that reconnects on its own
# schedule can lock an account while nobody is watching.
#
# Per tunnel:
#   autostart: true    dial as soon as the server comes up
#   max_attempts: 3    how many times to try before stopping and waiting
#
# A tunnel that has been started or stopped from a client keeps that decision
# across a server restart, whatever autostart says.

tunnels:
  # A credential-free tunnel that dials straight out. Useful for verifying
  # routing, the GUI and failover without touching a real VPN.
  - name: mock
    provider: mock
    image: coosir/vg-mock:latest
    server: mock.example.com
    username: tester
    # Nothing to lock out, so this one may as well come up by itself.
    autostart: true
    extra:
      routes: "10.99.0.0/16"
      dns: "10.99.0.53"
      search_domains: "mock.internal"

  # Sangfor EasyConnect.
  - name: school-ec
    provider: easyconnect
    image: coosir/vg-sangfor:latest
    server: vpn.example.edu.cn
    username: alice
    # Never put a password in this file. Point at an environment variable on
    # the server, or a 0600 file. With the shipped systemd unit the variable
    # goes in /etc/vpn-gateway/credentials.env, single-quoted; see "Where the
    # password goes" in docs/DEPLOY.md.
    password_env: SCHOOL_EC_PASSWORD
    extra:
      # zju-connect does not report pushed routes in a stable machine-readable
      # form, so state the intranet ranges here. The client turns these into
      # routing rules automatically.
      routes: "10.0.0.0/8,192.168.0.0/16"
      dns: "10.10.0.21"
      search_domains: "example.edu.cn"
    disabled: true

  # Fortinet, through OpenConnect. The same image also serves GlobalProtect,
  # Pulse, F5, Juniper, Array and AnyConnect: change provider, not image.
  - name: corp-forti
    provider: fortinet
    image: coosir/vg-openconnect:latest
    server: vpn.corp.example
    username: alice
    password_env: CORP_FORTI_PASSWORD
    # The client creates a tun interface and installs routes. Both stay inside
    # this container's own network namespace, which is what lets several of
    # these run at once.
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    extra:
      routes: "10.30.0.0/16"
      dns: "10.30.0.53"
      # The realm or group from the gateway's login form, when it has one.
      authgroup: "corp"
      # Two-factor comes in two shapes, and nothing in the protocol tells
      # them apart, so say which one this gateway uses.
      #
      # The gateway asks for a code separately, and it is answered from a
      # seed rather than by a person on every reconnect:
      # totp_secret: "BASE32SEED"
      #
      # Or the gateway has no second prompt and wants the code joined onto
      # the end of the password, so the field carries "yourpassword123456":
      # totp_secret: "BASE32SEED"
      # totp_append: "true"
      #
      # Only if the gateway departs from the usual six digits over thirty
      # seconds with SHA-1:
      # totp_digits: "8"
      # totp_period: "60"
      # totp_algorithm: "sha256"
      # Pin the gateway's certificate. openconnect prints the value to use the
      # first time it refuses to trust one.
      # servercert: "pin-sha256:..."
    disabled: true

  # Sangfor aTrust: the same image, a different protocol.
  - name: corp-atrust
    provider: atrust
    image: coosir/vg-sangfor:latest
    server: atrust.example.com
    username: alice
    password_env: CORP_ATRUST_PASSWORD
    extra:
      routes: "172.16.0.0/12"
      dns: "172.16.0.53"
    disabled: true
