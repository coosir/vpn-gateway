<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vpn-gateway</title>
<style>
/* ---------------------------------------------------------------------------
   An instrument panel, not a dashboard.
   Everything is monospace and every font is one the machine already has: this
   interface is most needed when the tunnels are down, which is exactly when
   there is no network to fetch a webfont from.
--------------------------------------------------------------------------- */
:root {
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo,
          Consolas, "DejaVu Sans Mono", monospace;

  --bg:        #f4f2ed;
  --surface:   #fbfaf7;
  --raised:    #ffffff;
  --hair:      #e2ddd2;
  --hair-firm: #cdc6b8;
  --ink:       #17191d;
  --dim:       #666b73;
  --faint:     #9aa0a7;
  --live:      #14795f;
  --live-bg:   #e2f0eb;
  --down:      #b04226;
  --down-bg:   #f7e6e1;
  --amber:     #9a6412;
  --amber-bg:  #f6ecd9;
  --focus:     #1a1c20;
  --lamp-glow: none;
}
/* Dark palette, applied by the explicit choice or by the system default. */
:root[data-theme="dark"] {
  --bg:        #0d0f12;
  --surface:   #14171c;
  --raised:    #191d23;
  --hair:      #232830;
  --hair-firm: #333b45;
  --ink:       #d7dce3;
  --dim:       #7b838f;
  --faint:     #565e69;
  --live:      #45c9a3;
  --live-bg:   #10241f;
  --down:      #e3705a;
  --down-bg:   #2a1512;
  --amber:     #e0a458;
  --amber-bg:  #2a2011;
  --focus:     #d7dce3;
  --lamp-glow: 0 0 7px currentColor;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --bg:        #0d0f12;
    --surface:   #14171c;
    --raised:    #191d23;
    --hair:      #232830;
    --hair-firm: #333b45;
    --ink:       #d7dce3;
    --dim:       #7b838f;
    --faint:     #565e69;
    --live:      #45c9a3;
    --live-bg:   #10241f;
    --down:      #e3705a;
    --down-bg:   #2a1512;
    --amber:     #e0a458;
    --amber-bg:  #2a2011;
    --focus:     #d7dce3;
    --lamp-glow: 0 0 7px currentColor;
  }
}

* { box-sizing: border-box; }
/* An author rule with a display value beats the user agent's [hidden] rule,
   so anything toggled by the hidden attribute needs this to actually hide. */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.5 var(--mono);
  font-variant-ligatures: none;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

/* --- shell ------------------------------------------------------------- */
.shell { display: grid; grid-template-rows: auto 1fr; height: 100%; }

.bar {
  display: flex; align-items: center; gap: 20px;
  padding: 0 18px; height: 46px;
  background: var(--surface);
  border-bottom: 1px solid var(--hair);
  position: sticky; top: 0; z-index: 20;
}
.mark {
  font-weight: 700; letter-spacing: .1em; font-size: 11px;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 9px;
}
.mark .bug {
  width: 9px; height: 9px; border-radius: 2px;
  background: var(--live); color: var(--live);
  box-shadow: var(--lamp-glow);
}
.bar .gap { flex: 1; }
.readout { display: flex; gap: 18px; color: var(--dim); font-size: 11px; }
.readout b { color: var(--ink); font-weight: 600; }

.body { display: grid; grid-template-columns: 168px 1fr; min-height: 0; }

.rail {
  border-right: 1px solid var(--hair);
  padding: 14px 0;
  background: var(--surface);
  display: flex; flex-direction: column; gap: 1px;
}
.rail button {
  appearance: none; border: 0; background: none; color: var(--dim);
  font: inherit; text-align: left; cursor: pointer;
  padding: 7px 18px; display: flex; align-items: center; gap: 10px;
  border-left: 2px solid transparent;
}
.rail button:hover { color: var(--ink); background: var(--bg); }
.rail button[aria-current="true"] {
  color: var(--ink); border-left-color: var(--amber); background: var(--bg);
}
.rail .count {
  margin-left: auto; font-size: 10px; color: var(--faint);
}
.rail .sep { height: 1px; background: var(--hair); margin: 12px 18px; }
.rail .meta {
  padding: 4px 18px; font-size: 10px; color: var(--faint); line-height: 1.7;
  white-space: pre-line; overflow-wrap: anywhere;
}

.pane { overflow: auto; padding: 22px 26px 60px; min-width: 0; }

h2 {
  margin: 0 0 3px; font-size: 12px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
}
.sub { margin: 0 0 20px; color: var(--dim); font-size: 11px; max-width: 62ch; }

/* --- tunnels: a wiring diagram ----------------------------------------- */
.tunnels { position: relative; }
/* The bus every lamp sits on. */
.tunnels::before {
  content: ""; position: absolute; left: 5.5px; top: 14px; bottom: 14px;
  width: 1px; background: var(--hair-firm);
}
.tunnel {
  display: grid;
  grid-template-columns: 12px minmax(96px, 168px) 52px minmax(0, 1fr) auto;
  gap: 18px; align-items: baseline;
  padding: 11px 0;
  border-bottom: 1px solid var(--hair);
  animation: rise .28s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(3px); } }
@media (prefers-reduced-motion: reduce) { .tunnel { animation: none; } }

.lamp {
  width: 11px; height: 11px; border-radius: 50%;
  align-self: center; justify-self: center;
  border: 1px solid var(--hair-firm);
  background: var(--bg);
  transition: background .2s, box-shadow .2s, border-color .2s;
}
.lamp.on {
  background: var(--live); border-color: var(--live);
  color: var(--live); box-shadow: var(--lamp-glow);
}
.lamp.off {
  background: var(--down); border-color: var(--down);
  color: var(--down); box-shadow: var(--lamp-glow);
}
.lamp.idle {
  background: var(--bg); border-color: var(--hair-firm);
  color: transparent; box-shadow: none;
}
.tstate.idle { color: var(--faint); }
.trow-actions { display: flex; gap: 6px; align-items: center; }
.tname { font-weight: 600; overflow-wrap: anywhere; }
.tstate { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.tstate.on { color: var(--live); }
.tstate.off { color: var(--down); }
.facts { color: var(--dim); font-size: 11px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.facts .k { color: var(--faint); }
.facts code { color: var(--ink); }

/* --- rules -------------------------------------------------------------- */
.rule {
  border: 1px solid var(--hair); background: var(--surface);
  padding: 12px; margin-bottom: 10px;
  transition: opacity .15s ease;
}
.rule.disabled {
  opacity: .52;
  background: var(--bg);
  border-style: dashed;
}
.rule-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--hair);
}
.rule-badges { display: flex; gap: 6px; align-items: center; }
.badge {
  font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 2px;
  background: var(--hair-firm); color: var(--ink);
}
.badge.auto {
  background: var(--live-bg); color: var(--live); border: 1px solid currentColor;
}
.badge.custom {
  background: var(--hair); color: var(--dim);
}
.badge.disabled-tag {
  background: var(--down-bg); color: var(--down); border: 1px solid currentColor;
}
.matcher { display: flex; gap: 8px; margin-bottom: 7px; align-items: center; }
.matcher.readonly { color: var(--dim); padding: 4px 0; font-size: 12px; }
.matcher.readonly code { color: var(--ink); font-weight: 600; }
.matcher select { width: 148px; flex: none; }
.matcher input { flex: 1; min-width: 0; }
.rule-foot {
  display: flex; gap: 10px; align-items: center;
  margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--hair);
}
.rule-foot .arrow { color: var(--faint); }
.rule-foot .grow { flex: 1; }

select, input[type=text] {
  appearance: none; font: inherit; color: var(--ink);
  background: var(--raised);
  border: 1px solid var(--hair-firm); border-radius: 0;
  padding: 5px 8px; min-width: 0;
}
select { padding-right: 24px; background-image: none; }
input[type=text]::placeholder { color: var(--faint); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

button.act {
  appearance: none; font: inherit; cursor: pointer;
  background: var(--raised); color: var(--ink);
  border: 1px solid var(--hair-firm); padding: 5px 11px;
}
button.act:hover { border-color: var(--focus); }
button.act.primary {
  background: var(--ink); color: var(--bg); border-color: var(--ink);
}
button.act.primary:hover { opacity: .86; }
button.act.quiet { border-color: transparent; color: var(--dim); background: none; }
button.act.quiet:hover { color: var(--down); border-color: var(--hair-firm); }
button.act:disabled { opacity: .45; cursor: default; }

.toolbar { display: flex; gap: 9px; align-items: center; margin: 16px 0 0; }
.note { font-size: 11px; color: var(--dim); }
.note.bad { color: var(--down); }
.note.good { color: var(--live); }

/* --- nodes & subscriptions -------------------------------------------- */
.node-card {
  border: 1px solid var(--hair); background: var(--surface);
  padding: 10px 14px; margin-bottom: 8px;
  display: grid; grid-template-columns: 1fr auto auto;
  gap: 12px; align-items: center;
  transition: border-color .15s ease, background .15s ease;
}
.node-card.active {
  border-color: var(--live);
  background: var(--raised);
}
.node-info { min-width: 0; }
.node-name { font-weight: 600; margin-bottom: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.node-detail { font-size: 11px; color: var(--dim); display: flex; gap: 10px; }
.node-detail span { color: var(--faint); }
.badge.active-tag {
  background: var(--live-bg); color: var(--live); border: 1px solid currentColor;
}
.badge.ping { font-family: var(--mono); }
.badge.ping.good { background: var(--live-bg); color: var(--live); border: 1px solid currentColor; }
.badge.ping.medium { background: var(--amber-bg); color: var(--amber); border: 1px solid currentColor; }
.badge.ping.bad { background: var(--down-bg); color: var(--down); border: 1px solid currentColor; }

.sub-card {
  border: 1px solid var(--hair); background: var(--surface);
  padding: 12px 14px; margin-bottom: 12px;
}
.sub-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.sub-name { font-weight: 600; font-size: 13px; }
.sub-url { font-size: 11px; color: var(--dim); overflow-wrap: anywhere; margin-bottom: 6px; }
.sub-meta { font-size: 11px; color: var(--faint); display: flex; gap: 14px; align-items: center; }

/* --- setup and settings ------------------------------------------------- */
.phase { font-size: 11px; color: var(--dim); margin-right: 4px; }
.phase b { color: var(--ink); font-weight: 600; }
.phase.live b { color: var(--live); }
.phase.bad b { color: var(--down); }

.steps { margin: 0 0 22px; padding-left: 20px; max-width: 74ch; }
.steps li { margin-bottom: 20px; }
.steps b { font-weight: 600; }
.steps p { margin: 4px 0 9px; color: var(--dim); font-size: 12px; }
.cmd {
  margin: 0; padding: 9px 11px; font-size: 11.5px;
  background: var(--surface); border: 1px solid var(--hair);
  overflow-x: auto; color: var(--ink);
}
.drop { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
.drop .or { color: var(--faint); font-size: 11px; }
textarea {
  width: 100%; max-width: 74ch; font: inherit; font-size: 11.5px;
  color: var(--ink); background: var(--raised);
  border: 1px solid var(--hair-firm); border-radius: 0; padding: 9px 11px;
  resize: vertical;
}
textarea::placeholder { color: var(--faint); }

.field { margin-bottom: 20px; max-width: 74ch; }
.field > label {
  display: block; font-size: 11px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--dim); margin-bottom: 7px;
}
.field .hint { margin: 6px 0 0; font-size: 11px; color: var(--faint); }
.service-state { margin: 0; font-size: 12px; }
.service-state b { font-weight: 600; }
.service-state b.on { color: var(--live); }
.service-state b.off { color: var(--dim); }
.choices { display: flex; gap: 10px; flex-wrap: wrap; }
.choice {
  flex: 1; min-width: 220px; display: flex; gap: 9px; align-items: flex-start;
  padding: 11px 13px; border: 1px solid var(--hair-firm);
  background: var(--surface); cursor: pointer;
}
.choice:hover { border-color: var(--focus); }
.choice input { margin-top: 2px; accent-color: var(--amber); }
.choice b { display: block; font-weight: 600; margin-bottom: 3px; }
.choice em { font-style: normal; font-size: 11px; color: var(--dim); }
.check { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 12px; }
.check input { accent-color: var(--amber); }

/* --- logs --------------------------------------------------------------- */
.logs {
  background: var(--surface); border: 1px solid var(--hair);
  padding: 12px 14px; margin: 0;
  font-size: 11.5px; line-height: 1.65;
  white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 62vh; overflow: auto; color: var(--dim);
}
.logs strong { color: var(--ink); font-weight: 500; }

/* --- the prompt: the one moment that must interrupt --------------------- */
.veil {
  position: fixed; inset: 0; z-index: 60;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(3px);
  display: grid; place-items: center; padding: 24px;
}
.prompt {
  width: min(520px, 100%);
  background: var(--raised);
  border: 1px solid var(--hair-firm);
  border-top: 2px solid var(--amber);
  padding: 22px 24px 20px;
  box-shadow: 0 24px 60px -24px rgba(0,0,0,.45);
  animation: drop .22s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } }
@media (prefers-reduced-motion: reduce) { .prompt { animation: none; } }
.prompt .kind {
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--amber); margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.prompt .kind::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: var(--amber); color: var(--amber); box-shadow: var(--lamp-glow);
}
.prompt h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.prompt .why { margin: 0 0 16px; color: var(--dim); font-size: 12px; }
.prompt input[type=text] {
  width: 100%; font-size: 19px; letter-spacing: .1em;
  padding: 10px 12px; text-align: center;
}
.prompt .link {
  display: block; margin: 0 0 14px; padding: 9px 11px;
  background: var(--amber-bg); border: 1px solid var(--hair);
  font-size: 11px; overflow-wrap: anywhere;
}
.prompt .foot {
  display: flex; align-items: center; gap: 10px; margin-top: 16px;
}
.prompt .expiry { flex: 1; font-size: 11px; color: var(--dim); }
.prompt .expiry.soon { color: var(--down); }

.empty {
  border: 1px dashed var(--hair-firm); padding: 22px;
  color: var(--dim); font-size: 12px; text-align: center;
}
.offline {
  background: var(--down-bg); color: var(--down);
  border: 1px solid currentColor; padding: 7px 11px;
  font-size: 11px; margin-bottom: 16px;
}
/* --- mode switcher segmented control --- */
.mode-group {
  display: inline-flex;
  background: var(--bg);
  border: 1px solid var(--hair-firm);
  border-radius: 4px;
  padding: 2px;
  gap: 2px;
}
.mode-btn {
  appearance: none;
  border: 0;
  background: none;
  color: var(--dim);
  font: inherit;
  font-size: 11px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 3px;
  cursor: pointer;
  transition: all .15s ease;
}
.mode-btn:hover {
  color: var(--ink);
  background: var(--surface);
}
.mode-btn.active {
  color: var(--ink);
  background: var(--surface);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,.1);
}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="mark"><span class="bug" id="bug"></span>vpn-gateway</div>
    <div class="readout">
      <span><b id="r-up">0</b>/<span id="r-total">0</span> <span data-i18n="bar.up"></span></span>
      <span><span data-i18n="bar.ingress"></span> <b id="r-ingress">—</b></span>
      <span><span data-i18n="bar.onfail"></span> <b id="r-fail">—</b></span>
    </div>
    <div class="mode-group" id="bar-mode-group">
      <button class="mode-btn" data-mode="rule" data-i18n="mode.rule"></button>
      <button class="mode-btn" data-mode="global" data-i18n="mode.global"></button>
      <button class="mode-btn" data-mode="direct" data-i18n="mode.direct"></button>
    </div>
    <div class="gap"></div>
    <span class="phase" id="phase"></span>
    <button class="act primary" id="toggle" hidden></button>
    <button class="act" id="lang" data-i18n-title="bar.langTitle">中文</button>
    <button class="act" id="theme" data-i18n-title="bar.themeTitle">theme</button>
  </header>

  <div class="body">
    <nav class="rail">
      <button data-pane="tunnels" aria-current="true"><span data-i18n="nav.tunnels"></span><span class="count" id="c-tunnels"></span></button>
      <button data-pane="nodes"><span data-i18n="nav.nodes"></span><span class="count" id="c-nodes"></span></button>
      <button data-pane="rules"><span data-i18n="nav.rules"></span><span class="count" id="c-rules"></span></button>
      <button data-pane="logs" data-i18n="nav.logs"></button>
      <button data-pane="settings" data-i18n="nav.settings"></button>
      <button data-pane="config" data-i18n="nav.config"></button>
      <button data-pane="setup" data-i18n="nav.setup"></button>
      <div class="sep"></div>
      <div class="meta" id="railmeta"></div>
    </nav>

    <main>
      <section class="pane" id="pane-nodes" hidden>
        <h2 data-i18n="nodes.title"></h2>
        <p class="sub" data-i18n="nodes.sub"></p>

        <div style="margin-bottom: 20px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--hair-firm); border-radius: 6px;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>
              <div style="font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin-bottom: 3px;" data-i18n="nodes.modeCardTitle"></div>
              <div style="font-size: 12px;" id="mode-desc"></div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <div class="mode-group" id="pane-mode-group">
                <button class="mode-btn" data-mode="rule" data-i18n="mode.rule"></button>
                <button class="mode-btn" data-mode="global" data-i18n="mode.global"></button>
                <button class="mode-btn" data-mode="direct" data-i18n="mode.direct"></button>
              </div>
              <button class="act quiet" id="clear-proxy-btn" data-i18n="nodes.deselect" style="font-size: 11px;" hidden></button>
            </div>
          </div>
        </div>

        <div class="toolbar" style="margin:0 0 16px">
          <button class="act primary" id="add-node-btn" data-i18n="nodes.addNode"></button>
          <button class="act" id="add-sub-btn" data-i18n="nodes.addSub"></button>
          <button class="act quiet" id="ping-all-btn" data-i18n="nodes.pingAll"></button>
          <button class="act quiet" id="update-all-subs-btn" data-i18n="nodes.updateAllSubs"></button>
          <span class="note" id="nodes-note"></span>
        </div>

        <div style="margin-bottom: 24px;">
          <h3 style="font-size:11px;margin:0 0 10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--dim)" data-i18n="nodes.subsTitle"></h3>
          <div id="subscriptions-list"></div>
        </div>

        <div>
          <h3 style="font-size:11px;margin:0 0 10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--dim)" data-i18n="nodes.nodesTitle"></h3>
          <div id="nodes-list"></div>
        </div>
      </section>

      <section class="pane" id="pane-setup" hidden>
        <h2 data-i18n="setup.title"></h2>
        <p class="sub" data-i18n="setup.sub"></p>

        <ol class="steps">
          <li>
            <b data-i18n="setup.s1.t"></b>
            <p data-i18n="setup.s1.b"></p>
            <pre class="cmd">vgctl -config /etc/vpn-gateway/config.yaml client-config &gt; client.json</pre>
          </li>
          <li>
            <b data-i18n="setup.s2.t"></b>
            <p data-i18n="setup.s2.b"></p>
            <div class="drop" id="drop">
              <input type="file" id="bundle-file" accept=".json,application/json" hidden>
              <button class="act" id="bundle-pick" data-i18n="setup.pick"></button>
              <span class="or" data-i18n="setup.or"></span>
            </div>
            <textarea id="bundle-text" rows="7" spellcheck="false"
                      data-i18n-ph="setup.paste"></textarea>
          </li>
          <li>
            <b data-i18n="setup.s3.t"></b>
            <p data-i18n="setup.s3.b"></p>
            <div style="display:flex;gap:8px;margin-top:6px">
              <input type="text" id="bundle-user" data-i18n-ph="auth.username" style="flex:1" autocomplete="username">
              <input type="password" id="bundle-pass" data-i18n-ph="auth.password" style="flex:1" autocomplete="current-password">
            </div>
          </li>
        </ol>

        <div class="toolbar">
          <button class="act primary" id="bundle-save" data-i18n="setup.save"></button>
          <span class="note" id="setup-note"></span>
        </div>
      </section>

      <section class="pane" id="pane-tunnels">

<script>
"use strict";

/* The token arrives in the address bar once and is kept for this tab only, so
   a bookmark or a shared screenshot of the URL does not stay usable. */
const TOKEN = (() => {
  const p = new URLSearchParams(location.search);
  const fromURL = p.get("token");
  if (fromURL) {
    sessionStorage.setItem("vg.token", fromURL);
    history.replaceState(null, "", location.pathname);
    return fromURL;
  }
  return sessionStorage.getItem("vg.token") || "";
})();

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: "Bearer " + TOKEN },
  });
  if (!res.ok) {
    let msg = res.status + " " + res.statusText;
    try { const b = await res.json(); if (b.error) msg = b.error; } catch (_) {}
    throw new Error(msg);
  }
  return res;
}

let lang = localStorage.getItem("vg.lang") || "zh";
if (!STRINGS[lang]) lang = "zh";

/* t looks a key up in the current language. %s and %d are replaced in order,
   so a sentence can put its value wherever that language needs it. */
function t(key, ...args) {
  let out = (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;
  for (const a of args) out = out.replace(/%[sd]/, a);
  return out;
}

/* Durations are written the way each language writes them, rather than
   dropping an English "4m 9s" into a Chinese sentence. */
function duration(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const sec = totalSeconds % 60;
  return (m > 0 ? t("dur.m", m) : "") + t("dur.s", sec);
}

function applyLanguage() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach((n) => {
    n.textContent = t(n.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-title]").forEach((n) => {
    n.title = t(n.dataset.i18nTitle);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((n) => {
    n.placeholder = t(n.dataset.i18nPh);
  });
  $("lang").textContent = lang === "zh" ? "中文" : "EN";
}

/* --- theme --------------------------------------------------------------- */
const root = document.documentElement;
root.dataset.theme = localStorage.getItem("vg.theme") || "auto";
$("theme").addEventListener("click", () => {
  const order = ["auto", "light", "dark"];
  const next = order[(order.indexOf(root.dataset.theme) + 1) % order.length];
  root.dataset.theme = next;
  localStorage.setItem("vg.theme", next);
  $("theme").textContent = next === "auto" ? "theme" : next;
});
$("theme").textContent = root.dataset.theme === "auto" ? "theme" : root.dataset.theme;

$("lang").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem("vg.lang", lang);
  applyLanguage();
  // Everything drawn from data has to be redrawn in the new language.
  renderedRules = null;
  renderedTunnels = null;
  shownPrompt = null;
  render(state);
  if (currentPane() === "settings") fillSettings();
});

/* --- panes --------------------------------------------------------------- */
document.querySelectorAll(".rail button[data-pane]").forEach((b) => {
  b.addEventListener("click", () => showPane(b.dataset.pane));
});

/* --- state --------------------------------------------------------------- */
let state = { tunnels: [], prompts: [], rules: [], client: {}, server: {} };
let draft = null;          // rules being edited; null means "showing live"
let shownPrompt = null;
/* What the rules editor is currently showing. Rebuilding the editor for an
   update that changed nothing would throw away the field someone had just
   clicked into, along with anything they had started typing. */
let renderedRules = null;
/* Same idea for the tunnel list, which is redrawn from scratch: rebuilding
   rows that say exactly what they already said replays their animation and
   moves the button under a hand that was reaching for it. */
let renderedTunnels = null;

function render(s) {
  // Lists the client has nothing to put in can arrive as null rather than as
  // an empty list. Everything below iterates them, so they are made into
  // lists once, here, rather than guarded at each reader.
  s.tunnels = s.tunnels || [];
  s.rules = s.rules || [];
  s.prompts = s.prompts || [];
  s.subscriptions = s.subscriptions || [];
  s.custom_nodes = s.custom_nodes || [];
  s.all_nodes = s.all_nodes || [];
  state = s;
  renderPhase(s);
  renderReadout(s);
  const freshTunnels = JSON.stringify(s.tunnels);
  if (freshTunnels !== renderedTunnels) {
    renderedTunnels = freshTunnels;
    renderTunnels(s.tunnels);
  }
  renderNodes(s);
  renderLogTunnels(s.tunnels);
  stampTunnels(s.at);
  if (draft === null) {
    const fresh = JSON.stringify(s.rules);
    if (fresh !== renderedRules) {
      renderedRules = fresh;
      renderRules(s.rules);
    }
  }
  $("c-tunnels").textContent = s.tunnels.length || "";
  $("c-nodes").textContent = s.all_nodes.length || "";
  $("c-rules").textContent = (draft || s.rules).length || "";
  renderPrompt(s.prompts);
}

/* --- phase: what the whole application is doing ------------------------ */
const PHASE_ACTION = {
  setup: null, connecting: null,
  idle: "act.connect", connected: "act.disconnect", failed: "act.retry",
};

/* The phase the last render drew, so a change of phase can be told from a
   redraw that found the same one. */
let lastPhase = null;

function renderPhase(st) {
  const phase = (st.session && st.session.phase) || "setup";
  const box = $("phase");
  box.className = "phase" + (phase === "connected" ? " live" : phase === "failed" ? " bad" : "");
  box.innerHTML = "";
  box.appendChild(el("span", null, t("bar.phase") + " "));
  box.appendChild(el("b", null, t("phase." + phase)));

  const btn = $("toggle");
  const action = PHASE_ACTION[phase];
  btn.hidden = !action;
  if (action) btn.textContent = t(action);

  // Setup is the only thing worth showing until there is something to
  // connect to; the other panes would all be empty.
  const ready = phase !== "setup";
  document.querySelectorAll('.rail button[data-pane]').forEach((b) => {
    b.hidden = !ready && b.dataset.pane !== "setup";
  });
  // Move on when the import lands, and only then. Doing it whenever a render
  // found the pane open meant the page could never be shown again: a bundle
  // has to be re-imported whenever the server gains a tunnel, and the pane
  // that does it was being closed the moment anything redrew.
  if (!ready) showPane("setup");
  else if (lastPhase === "setup") showPane("tunnels");
  lastPhase = phase;

  if (phase === "failed" && st.session.last_error) {
    $("offline").hidden = false;
    $("offline").textContent = st.session.last_error;
  }
}

function currentPane() {
  const open = document.querySelector('.pane:not([hidden])');
  return open ? open.id.replace("pane-", "") : "";
}

function showPane(name) {
  document.querySelectorAll(".rail button[data-pane]").forEach((o) =>
    o.setAttribute("aria-current", String(o.dataset.pane === name)));
  document.querySelectorAll(".pane").forEach((p) => (p.hidden = p.id !== "pane-" + name));
  if (name === "tunnels") refreshTunnels();
  if (name === "nodes") renderNodes(state);
  if (name === "config") loadGeneratedConfig();
  if (name === "logs" && $("log-tunnel").value) loadLogs();
  if (name === "settings") fillSettings();
}

$("toggle").addEventListener("click", async () => {
  const phase = state.session ? state.session.phase : "setup";
  const path = phase === "connected" ? "/api/disconnect" : "/api/connect";
  $("toggle").disabled = true;
  try {
    const res = await api(path, { method: "POST" });
    render(await res.json());
  } catch (e) {
    $("offline").hidden = false;
    $("offline").textContent = e.message;
  } finally {
    $("toggle").disabled = false;
  }
});

$("bundle-file").addEventListener("change", async (ev) => {

$("bundle-save").addEventListener("click", async () => {
  const note = $("setup-note");
  const raw = $("bundle-text").value.trim();
  if (!raw) {
    note.className = "note bad";
    note.textContent = t("setup.empty");
    return;
  }
  note.className = "note";
  note.textContent = "…";
  $("bundle-save").disabled = true;
  try {
    const res = await api("/api/bundle", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: raw,
    });
    const st = await res.json();
    const u = $("bundle-user").value.trim();

      await api("/api/settings", {

    note.className = "note good";
    note.textContent = t("setup.done");
    $("bundle-text").value = "";
    $("bundle-user").value = "";
    $("bundle-pass").value = "";
    render(st);
  } catch (e) {
    note.className = "note bad";
    note.textContent = e.message;
  } finally {
    $("bundle-save").disabled = false;
  }
});

/* --- settings ------------------------------------------------------------ */
function fillSettings() {
  const c = state.client || {};
  document.querySelectorAll('input[name=ingress]').forEach((r) => {
    r.checked = r.value === (c.tun ? "tun" : "proxy");
  });
  $("set-username").value = c.username || "";
  $("set-password").value = c.password || "";
  $("set-proxy-listen").value = c.proxy_listen || "";
  $("set-onfail").value = c.on_failure || "direct";
  $("set-dns").value = c.dns_default || "";
  $("set-autoroutes").checked = !!c.auto_routes;
  $("set-autodomains").checked = !!c.auto_domains;

  // The two targets are values the client parses; only the labels translate.
  const opts = $("set-onfail").options;
  opts[0].textContent = t("t.direct");
  opts[1].textContent = t("t.block");

  loadService();
}

/* --- the background service ---------------------------------------------
   Creating a TUN interface needs privileges an application opened from a
   launcher does not have. Rather than explaining that and leaving someone to
   find a terminal, the interface installs the service that does have them.

   The service state is fetched on its own rather than carried in the state
   everything else uses: answering it runs launchctl, and the tray reads that
   state every few seconds. */
let service = { supported: false };

async function loadService() {
  try {
    const res = await api("/api/service");
    renderService(await res.json());
  } catch (_) {
    // An interface that cannot answer this is one where the question does
    // not arise; the rest of the settings still work.
    $("service-field").hidden = true;
  }
}

function renderService(sv) {
  service = sv || {};
  $("service-field").hidden = !service.supported;
  if (!service.supported) return;

  const label = $("service-state");
  if (!service.installed) {
    label.textContent = t("service.absent");
    label.className = "off";
  } else if (service.running) {
    label.textContent = t("service.running", service.pid || "?");
    label.className = "on";
  } else {
    label.textContent = t("service.stopped");
    label.className = "off";
  }

  // The blocker is the client's own sentence about why installing would fail,
  // so it is shown as written rather than restated.
  const detail = [];
  if (!service.installed && service.blocker) detail.push(service.blocker);
  if (service.installed && service.config_path && service.config_path !== configPathOf()) {
    detail.push(t("service.elsewhere", service.config_path));
  }
  if (!detail.length) detail.push(t("service.why"));
  $("service-detail").textContent = detail.join(" ");

  $("service-install").hidden = service.installed;
  $("service-install").disabled = !!service.blocker;
  $("service-uninstall").hidden = !service.installed;
}

/* The configuration this interface edits. A service running a different one
   is someone else's install, and saying so is more use than showing a state
   that has nothing to do with what is on this screen. */
function configPathOf() {
  return state.session ? state.session.config_path : "";
}

async function serviceAction(path, busyKey, doneKey) {
  const note = $("service-note");
  note.className = "note";
  note.textContent = t(busyKey);
  $("service-install").disabled = true;
  $("service-uninstall").disabled = true;
  try {
    const res = await api(path, { method: "POST" });
    const before = service.installed;
    renderService(await res.json());
    note.className = "note good";
    note.textContent = service.installed === before ? t("service.cancelled") : t(doneKey);
  } catch (e) {
    note.className = "note bad";
    note.textContent = e.message;
  } finally {
    $("service-uninstall").disabled = false;
    loadService();
  }
}

$("service-install").addEventListener("click", () =>
  serviceAction("/api/service/install", "service.installing", "service.installed"));
$("service-uninstall").addEventListener("click", () =>
  serviceAction("/api/service/uninstall", "service.uninstalling", "service.removed"));

$("settings-save").addEventListener("click", async () => {
  const note = $("settings-note");
  const tun = document.querySelector('input[name=ingress]:checked').value === "tun";
  const body = {
    tun: { enabled: tun, auto_route: true },
    proxy: { enabled: !tun, listen: $("set-proxy-listen").value.trim() || "127.0.0.1:1080" },
    dns_default: $("set-dns").value.trim() || "local",
    on_failure: $("set-onfail").value,
    auto_routes: $("set-autoroutes").checked,
    auto_domains: $("set-autodomains").checked,
    username: $("set-username").value.trim(),
    password: $("set-password").value.trim(),
  };
  note.className = "note";
  note.textContent = "…";
  $("settings-save").disabled = true;
  try {
    const res = await api("/api/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    note.className = "note good";
    note.textContent = t("settings.saved");
    render(await res.json());
  } catch (e) {
    note.className = "note bad";
    note.textContent = e.message;
  } finally {
    $("settings-save").disabled = false;
  }
});

function renderReadout(s) {
  const activeMode = s.mode || "rule";
  document.querySelectorAll(".mode-btn").forEach((b) => {
    b.classList.toggle("active", b.dataset.mode === activeMode);
  });

  const wanted = s.tunnels.filter((t) => t.wanted);
  const up = wanted.filter((t) => t.up).length;
  $("r-up").textContent = up;
  // Counted against the tunnels that were asked for: a stopped one is not a
  // tunnel that is failing to come up.
  $("r-total").textContent = wanted.length;
  const ingress = [s.client.tun && t("bar.tun"), s.client.proxy && t("bar.proxy")].filter(Boolean);
  $("r-ingress").textContent = ingress.join(" + ") || t("bar.none");
  // "direct" and "block" are values the client understands; only the label
  // shown here changes with the language.
  $("r-fail").textContent = s.client.on_failure === "block" ? t("t.block")
                          : s.client.on_failure === "direct" ? t("t.direct")
                          : (s.client.on_failure || "—");
  const healthy = wanted.length > 0 && up === wanted.length;
  $("bug").style.background = healthy ? "" : wanted.length ? "var(--down)" : "var(--faint)";
  $("bug").style.color = healthy ? "" : wanted.length ? "var(--down)" : "var(--faint)";

  const onOff = (v) => t(v ? "on" : "off");
  const bits = [];
  if (s.client.username) bits.push(t("auth.username") + " " + s.client.username);
  if (s.client.proxy_listen) bits.push(t("meta.proxy") + " " + s.client.proxy_listen);
  if (s.client.dns_default) {
    bits.push(t("meta.dns") + " " +
      (s.client.dns_default === "local" ? t("meta.dnsLocal") : s.client.dns_default));
  }
  bits.push(t("meta.autoroutes") + " " + onOff(s.client.auto_routes));
  bits.push(t("meta.autodomains") + " " + onOff(s.client.auto_domains));
  $("railmeta").textContent = bits.join("\n");
}

/* --- refreshing ----------------------------------------------------------
   Tunnel state is asked for rather than pushed. Dialling takes as long as the
   authentication behind it does, so a list that redrew itself every couple of
   seconds spent most of that time saying nothing new while shifting under the
   hand reaching for it. The stream still arrives on its own for a challenge
   waiting to be answered: nobody would think to press refresh for a code they
   were never told to expect. */
async function refreshTunnels() {
  const btn = $("tunnels-refresh");
  btn.disabled = true;
  try {
    const res = await api("/api/state");
    $("offline").hidden = true;
    render(await res.json());
  } catch (e) {
    $("offline").hidden = false;
    $("offline").textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}
$("tunnels-refresh").addEventListener("click", refreshTunnels);

/* When the reading was taken, so a list that has gone stale says so rather
   than looking like the tunnels simply stopped changing. */
function stampTunnels(at) {
  const d = new Date(at);
  $("tunnels-updated").textContent = isNaN(d)
    ? t("tunnels.never")
    : t("tunnels.updated", d.toTimeString().slice(0, 8));
}

function renderTunnels(tunnels) {
  const box = $("tunnels");
  box.textContent = "";
  if (!tunnels.length) {
    box.appendChild(el("div", "empty", t("tunnels.empty")));
    return;
  }
  tunnels.forEach((tn, i) => {
    const row = el("div", "tunnel");
    row.style.animationDelay = Math.min(i * 45, 400) + "ms";

    // Three states, not two. A tunnel nobody has asked for is stopped on
    // purpose; showing it as "down" beside one that failed to dial would put
    // the same face on a decision and a fault.
    const cls = tn.up ? "on" : tn.wanted ? "off" : "idle";
    const label = tn.up ? t("tunnels.up") : tn.wanted ? t("tunnels.down") : t("tunnels.stopped");
    row.appendChild(el("span", "lamp " + cls));
    row.appendChild(el("span", "tname", tn.name));
    row.appendChild(el("span", "tstate " + cls, label));

    const facts = el("div", "facts");
    const add = (k, v) => {
      if (!v || !v.length) return;
      const wrap = el("span");
      wrap.appendChild(el("span", "k", k + " "));
      wrap.appendChild(el("code", null, Array.isArray(v) ? v.join(" ") : v));
      facts.appendChild(wrap);
    };
    add(t("tunnels.routes"), tn.routes);
    add(t("tunnels.dns"), tn.dns);
    add(t("tunnels.search"), tn.search_domains);
    if (!tn.udp) facts.appendChild(el("span", "k", t("tunnels.tcpdns")));
    if (!facts.children.length) facts.appendChild(el("span", "k", t("tunnels.nothing")));
    row.appendChild(facts);

    const actions = el("div", "trow-actions");

    const toggle = el("button", "act" + (tn.wanted ? " quiet" : ""),
      tn.wanted ? t("tunnels.stop") : t("tunnels.start"));
    toggle.addEventListener("click", async () => {
      toggle.disabled = true;
      const path = "/api/tunnels/" + encodeURIComponent(tn.name) +
        (tn.wanted ? "/stop" : "/start");
      try {
        await api(path, { method: "POST" });
      } catch (e) {
        $("offline").hidden = false;
        $("offline").textContent = e.message;
      } finally {
        toggle.disabled = false;
      }
      // The server answers once it has asked, not once the tunnel is up, so
      // this reads back the decision. Whether the dial succeeded is the next
      // refresh's answer.
      refreshTunnels();
    });
    actions.appendChild(toggle);

    const go = el("button", "act quiet", t("tunnels.logs"));
    go.addEventListener("click", () => {
      document.querySelector('.rail button[data-pane="logs"]').click();
      $("log-tunnel").value = tn.name;
      loadLogs();
    });
    actions.appendChild(go);

    row.appendChild(actions);
    box.appendChild(row);
  });
}

let latencies = {};
let editingNodeId = null;

function renderNodes(s) {
  const subsBox = $("subscriptions-list");
  const nodesBox = $("nodes-list");
  if (!subsBox || !nodesBox) return;
  subsBox.textContent = "";
  nodesBox.textContent = "";

  const subs = s.subscriptions || [];
  const allNodes = s.all_nodes || [];
  const selectedTag = s.selected_node || "";
  const activeMode = s.mode || "rule";

  $("c-nodes").textContent = allNodes.length || "";

  // Update mode buttons
  document.querySelectorAll(".mode-btn").forEach((b) => {
    b.classList.toggle("active", b.dataset.mode === activeMode);
  });

  // Update mode description
  const modeDesc = $("mode-desc");
  if (modeDesc) {
    let activeNodeName = t("nodes.noActiveProxy");
    if (selectedTag) {
      const cleanTag = selectedTag.replace(/^node-/, "");
      const found = allNodes.find((n) => n.id === selectedTag || n.id === cleanTag || "node-" + n.id === selectedTag);
      if (found) activeNodeName = found.name;
    }
    modeDesc.textContent = t("mode." + activeMode + "Desc") + " (" + t("nodes.activeProxy") + ": " + activeNodeName + ")";
  }

  const clearBtn = $("clear-proxy-btn");
  if (clearBtn) {
    clearBtn.hidden = !selectedTag;
  }

  // 1. Subscriptions list
  if (!subs.length) {
    subsBox.appendChild(el("div", "empty", t("nodes.emptySubs")));
  } else {
    subs.forEach((sub) => {
      const card = el("div", "sub-card");
      const head = el("div", "sub-head");
      const nameWrap = el("div", "sub-name");
      nameWrap.appendChild(el("span", null, sub.name + " "));
      const count = sub.nodes ? sub.nodes.length : 0;
      nameWrap.appendChild(el("span", "badge custom", t("nodes.nodeCount", count)));
      head.appendChild(nameWrap);

      const acts = el("div", null);
      const updateBtn = el("button", "act", t("nodes.update"));
      updateBtn.addEventListener("click", async () => {
        updateBtn.disabled = true;
        const note = $("nodes-note");
        note.className = "note";
        note.textContent = t("nodes.updating");
        try {
          const res = await api("/api/subscriptions/" + encodeURIComponent(sub.id) + "/update", { method: "POST" });
          note.className = "note good";
          note.textContent = t("nodes.updated");
          render(await res.json());
        } catch (e) {
          note.className = "note bad";
          note.textContent = e.message;
        } finally {
          updateBtn.disabled = false;
        }
      });

      const delBtn = el("button", "act quiet", t("nodes.delete"));
      delBtn.addEventListener("click", async () => {
        if (!confirm(t("nodes.delete") + ": " + sub.name + "?")) return;
        delBtn.disabled = true;
        try {
          const res = await api("/api/subscriptions/" + encodeURIComponent(sub.id), { method: "DELETE" });
          render(await res.json());
        } catch (e) {
          $("nodes-note").className = "note bad";
          $("nodes-note").textContent = e.message;
        } finally {
          delBtn.disabled = false;
        }
      });

      acts.append(updateBtn, " ", delBtn);
      head.appendChild(acts);
      card.appendChild(head);

      const urlEl = el("div", "sub-url", sub.url);
      card.appendChild(urlEl);

      const meta = el("div", "sub-meta");
      const updatedStr = sub.updated_at ? t("nodes.lastUpdated", new Date(sub.updated_at).toLocaleString()) : t("nodes.neverUpdated");
      meta.appendChild(el("span", null, updatedStr));
      card.appendChild(meta);

      subsBox.appendChild(card);
    });
  }

  // 2. All Nodes list
  if (!allNodes.length) {
    nodesBox.appendChild(el("div", "empty", t("nodes.emptyNodes")));
  } else {
    allNodes.forEach((n) => {
      const isSelected = selectedTag === n.id || selectedTag === "node-" + n.id || ("node-" + selectedTag) === ("node-" + n.id);
      const card = el("div", "node-card" + (isSelected ? " active" : ""));

      // Info
      const info = el("div", "node-info");
      const nameLine = el("div", "node-name");
      nameLine.appendChild(el("span", null, n.name));
      if (isSelected) {
        nameLine.appendChild(el("span", "badge active-tag", t("nodes.active")));
      }
      const typeBadge = n.subscription_id ? t("t.subPrefix").trim() : t("t.customPrefix").trim();
      nameLine.appendChild(el("span", "badge custom", typeBadge));
      info.appendChild(nameLine);

      const details = el("div", "node-detail");
      details.appendChild(el("span", null, n.server + ":" + n.port));
      if (n.sni && n.sni !== n.server) {
        details.appendChild(el("span", null, "SNI: " + n.sni));
      }
      if (n.allow_insecure) {
        details.appendChild(el("span", null, "Insecure"));
      }
      info.appendChild(details);
      card.appendChild(info);

      // Latency Ping
      const pingWrap = el("div", null);
      pingWrap.style.display = "flex";
      pingWrap.style.alignItems = "center";
      pingWrap.style.gap = "8px";
      const lat = latencies[n.id];
      if (lat !== undefined) {
        const cls = lat < 0 ? "bad" : lat < 200 ? "good" : lat < 500 ? "medium" : "bad";
        const txt = lat < 0 ? t("nodes.timeout") : lat + " ms";
        pingWrap.appendChild(el("span", "badge ping " + cls, txt));
      }
      const pingBtn = el("button", "act quiet", t("nodes.ping"));
      pingBtn.addEventListener("click", async () => {
        pingBtn.disabled = true;
        pingBtn.textContent = "…";
        try {
          const res = await api("/api/nodes/ping", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: n.id }),
          });
          const data = await res.json();
          if (data.latencies) {
            Object.assign(latencies, data.latencies);
            renderNodes(state);
          }
        } catch (e) {
          $("nodes-note").className = "note bad";
          $("nodes-note").textContent = e.message;
        } finally {
          pingBtn.disabled = false;
          pingBtn.textContent = t("nodes.ping");
        }
      });
      pingWrap.appendChild(pingBtn);
      card.appendChild(pingWrap);

      // Actions
      const acts = el("div", null);
      if (isSelected) {
        const deselectBtn = el("button", "act quiet", t("nodes.deselect"));
        deselectBtn.addEventListener("click", async () => {
          deselectBtn.disabled = true;
          try {
            const res = await api("/api/nodes/select", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: "" }),
            });
            render(await res.json());
          } catch (e) {
            $("nodes-note").className = "note bad";
            $("nodes-note").textContent = e.message;
          } finally {
            deselectBtn.disabled = false;
          }
        });
        acts.appendChild(deselectBtn);
      } else {
        const selectBtn = el("button", "act primary", t("nodes.select"));
        selectBtn.addEventListener("click", async () => {
          selectBtn.disabled = true;
          try {
            const res = await api("/api/nodes/select", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: n.id }),
            });
            render(await res.json());
          } catch (e) {
            $("nodes-note").className = "note bad";
            $("nodes-note").textContent = e.message;
          } finally {
            selectBtn.disabled = false;
          }
        });
        acts.appendChild(selectBtn);
      }

      if (!n.subscription_id) {
        const editBtn = el("button", "act quiet", t("nodes.edit"));
        editBtn.addEventListener("click", () => openEditNodeModal(n));
        acts.append(" ", editBtn);

        const delBtn = el("button", "act quiet", t("nodes.delete"));
        delBtn.addEventListener("click", async () => {
          if (!confirm(t("nodes.delete") + ": " + n.name + "?")) return;
          delBtn.disabled = true;
          try {
            const res = await api("/api/nodes/" + encodeURIComponent(n.id), { method: "DELETE" });
            render(await res.json());
          } catch (e) {
            $("nodes-note").className = "note bad";
            $("nodes-note").textContent = e.message;
          } finally {
            delBtn.disabled = false;
          }
        });
        acts.append(" ", delBtn);
      }

      card.appendChild(acts);
      nodesBox.appendChild(card);
    });
  }
}

/* --- rules --------------------------------------------------------------- */
const MATCHER_KINDS = ["domain_suffix", "domain", "domain_keyword", "ip_cidr", "port"];

function currentRules() { return draft !== null ? draft : state.rules; }

function markDirty() {
  if (draft === null) draft = JSON.parse(JSON.stringify(state.rules || []));
  $("rules-note").textContent = t("rules.dirty");
  $("rules-note").className = "note";
}

function renderRules(rules) {
  const box = $("rules");
  box.textContent = "";

  const globalBanner = $("rules-global-banner");
  if (globalBanner) {
    globalBanner.hidden = (state.mode !== "global");
  }

  // Counted here rather than by whoever made the change, so the badge always
  // matches the rules on screen.
  $("c-rules").textContent = rules.length || "";
  if (!rules.length) {
    box.appendChild(el("div", "empty", t("rules.empty")));
    return;
  }
  rules.forEach((rule, ri) => {
    const card = el("div", "rule" + (rule.disabled ? " disabled" : ""));

    const head = el("div", "rule-head");
    const badges = el("div", "rule-badges");
    if (rule.auto) {
      badges.appendChild(el("span", "badge auto", t("rules.auto")));
      badges.appendChild(el("span", "badge", rule.tunnel));
    } else {
      badges.appendChild(el("span", "badge custom", t("rules.custom")));
    }
    if (rule.disabled) {
      badges.appendChild(el("span", "badge disabled-tag", t("rules.disabled")));
    }
    head.appendChild(badges);

    const toggleBtn = el("button", "act quiet", rule.disabled ? t("rules.enable") : t("rules.disable"));
    toggleBtn.addEventListener("click", () => {
      markDirty();
      draft[ri].disabled = !draft[ri].disabled;
      renderRules(draft);
    });
    head.appendChild(toggleBtn);
    card.appendChild(head);

    let kinds = MATCHER_KINDS.filter((k) => rule[k] && rule[k].length);
    if (!kinds.length) kinds = [MATCHER_KINDS[0]];

    if (rule.auto) {
      // Auto rules: read-only matchers, no edit or delete
      kinds.forEach((kind) => {
        const line = el("div", "matcher readonly");
        line.appendChild(el("span", "k", t("m." + kind) + ": "));
        line.appendChild(el("code", null, (rule[kind] || []).join(", ")));
        card.appendChild(line);
      });
      const hint = el("p", "note", t("rules.autoHint"));
      hint.style.margin = "8px 0 0";
      card.appendChild(hint);
    } else {
      // Custom rules: full edit/delete
      kinds.forEach((kind) => {
        const line = el("div", "matcher");
        const sel = el("select");
        MATCHER_KINDS.forEach((k) => {
          const o = el("option", null, t("m." + k));
          o.value = k;
          if (k === kind) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener("change", () => {
          markDirty();
          const values = draft[ri][kind] || [];
          delete draft[ri][kind];
          draft[ri][sel.value] = values;
          renderRules(draft);
        });

        const input = el("input");
        input.type = "text";
        input.placeholder = kind === "ip_cidr" ? t("ph.ip_cidr")
                          : kind === "port" ? t("ph.port")
                          : t("ph.domain");
        input.value = (rule[kind] || []).join(", ");
        input.addEventListener("input", () => {
          markDirty();
          const parts = input.value.split(",").map((v) => v.trim()).filter(Boolean);
          draft[ri][kind] = kind === "port" ? parts.map(Number).filter((n) => !isNaN(n)) : parts;
        });

        const drop = el("button", "act quiet", "✕");
        drop.title = t("rules.dropMatcher");
        drop.addEventListener("click", () => {
          markDirty();
          delete draft[ri][kind];
          renderRules(draft);
        });

        line.append(sel, input, drop);
        card.appendChild(line);
      });

      const foot = el("div", "rule-foot");
      const more = el("button", "act", t("rules.matcher"));
      more.addEventListener("click", () => {
        markDirty();
        const unused = MATCHER_KINDS.find((k) => !draft[ri][k] || !draft[ri][k].length);
        if (unused) { draft[ri][unused] = []; renderRules(draft); }
      });

      const target = el("select");
      const allNodes = state.all_nodes || [];
      const targets = ["direct", "block"];
      if (allNodes.length > 0) targets.push("proxy");
      targets.push(...state.tunnels.map((t) => t.name));
      targets.push(...allNodes.map((n) => "node-" + n.id));
      if (rule.tunnel && !targets.includes(rule.tunnel)) targets.push(rule.tunnel);
      targets.forEach((name) => {
        // The label is translated; the value is the name the client expects.
        const label = name === "direct" ? t("t.direct")
                    : name === "block" ? t("t.block")
                    : name === "proxy" ? t("t.proxy")
                    : name.startsWith("node-") && allNodes.find((n) => n.id === name.slice(5))
                    ? (allNodes.find((n) => n.id === name.slice(5)).subscription_id ? t("t.subPrefix") : t("t.customPrefix")) + allNodes.find((n) => n.id === name.slice(5)).name
                    : state.tunnels && state.tunnels.some((t) => t.name === name)
                    ? t("t.tunnelPrefix") + name
                    : name;
        const o = el("option", null, label);
        o.value = name;
        if (name === rule.tunnel) o.selected = true;
        target.appendChild(o);
      });
      target.addEventListener("change", () => { markDirty(); draft[ri].tunnel = target.value; });

      const remove = el("button", "act quiet", t("rules.delete"));
      remove.addEventListener("click", () => {
        markDirty();
        draft.splice(ri, 1);
        renderRules(draft);
      });

      foot.append(more, el("span", "grow"), remove, el("span", "arrow", "→"), target);
      card.appendChild(foot);
    }

    box.appendChild(card);
  });
}

$("add-rule").addEventListener("click", () => {
  markDirty();
  const newRule = { domain_suffix: [], tunnel: state.tunnels[0] ? state.tunnels[0].name : "direct", disabled: false, auto: false };
  const firstAutoIdx = draft.findIndex((r) => r.auto);
  if (firstAutoIdx >= 0) {
    draft.splice(firstAutoIdx, 0, newRule);
  } else {
    draft.push(newRule);
  }
  renderRules(draft);
});

$("revert-rules").addEventListener("click", () => {
  draft = null;
  renderedRules = JSON.stringify(state.rules);
  $("rules-note").textContent = "";
  renderRules(state.rules);
});

$("apply-rules").addEventListener("click", async () => {
  const rules = (draft || state.rules).map((r) => {
    const out = {
      tunnel: r.tunnel,
      disabled: !!r.disabled,
      auto: !!r.auto,
    };
    MATCHER_KINDS.forEach((k) => { if (r[k] && r[k].length) out[k] = r[k]; });
    return out;
  });
  const note = $("rules-note");
  note.className = "note";
  note.textContent = t("rules.applying");
  $("apply-rules").disabled = true;
  try {
    const res = await api("/api/rules", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(rules),
    });
    draft = null;
    // Force the editor to redraw from what the client accepted, rather than
    // from what was typed: the two can differ, and the accepted one is true.
    renderedRules = null;
    note.className = "note good";
    note.textContent = t("rules.saved");
    const freshRules = await res.json();
    state.rules = freshRules;
    renderRules(freshRules);
  } catch (e) {
    note.className = "note bad";
    note.textContent = e.message;
  } finally {
    $("apply-rules").disabled = false;
  }
});

/* --- logs ---------------------------------------------------------------- */
function renderLogTunnels(tunnels) {
  const sel = $("log-tunnel");
  const keep = sel.value;
  if (sel.children.length === tunnels.length &&
      [...sel.children].every((o, i) => tunnels[i] && o.value === tunnels[i].name)) return;
  sel.textContent = "";
  tunnels.forEach((tn) => {
    const o = el("option", null, tn.name);
    o.value = tn.name;
    sel.appendChild(o);
  });
  if (keep) sel.value = keep;
}

async function loadLogs() {
  const name = $("log-tunnel").value;
  if (!name) return;
  const out = $("logs");
  $("log-note").textContent = "";
  out.textContent = t("loading");
  try {
    const res = await api("/api/tunnels/" + encodeURIComponent(name) + "/logs?tail=300");
    const text = await res.text();
    out.textContent = text.trim() || t("logs.empty");
    out.scrollTop = out.scrollHeight;
  } catch (e) {
    out.textContent = "";
    $("log-note").className = "note bad";
    $("log-note").textContent = e.message;
  }
}
$("log-refresh").addEventListener("click", loadLogs);
$("log-tunnel").addEventListener("change", loadLogs);
$("log-reconnect").addEventListener("click", async () => {
  const name = $("log-tunnel").value;
  if (!name) return;
  try {
    await api("/api/tunnels/" + encodeURIComponent(name) + "/reconnect", { method: "POST" });
    $("log-note").className = "note good";
    $("log-note").textContent = t("logs.reconnecting", name);
  } catch (e) {
    $("log-note").className = "note bad";
    $("log-note").textContent = e.message;
  }
});

async function loadGeneratedConfig() {
  const out = $("genconfig");
  out.textContent = t("loading");
  try {
    const res = await api("/api/generated-config");
    out.textContent = JSON.stringify(await res.json(), null, 2);
  } catch (e) {
    out.textContent = e.message;
  }
}

/* --- prompts ------------------------------------------------------------- */
const KINDS = ["sms", "totp", "captcha", "url", "password", "vnc"];

function renderPrompt(prompts) {
  const p = prompts && prompts[0];
  if (!p) {
    $("veil").hidden = true;
    shownPrompt = null;
    return;
  }
  if (shownPrompt === p.id) return;
  shownPrompt = p.id;

  const known = KINDS.includes(p.type);
  $("p-kind").textContent = p.tunnel + " · " + p.type;
  $("p-title").textContent = known ? t("k." + p.type + ".t") : t("auth.generic");
  // The gateway's own wording is shown when there is any, because restating
  // it in another language would be guessing at what it said.
  $("p-why").textContent = p.prompt || (known ? t("k." + p.type + ".w") : t("prompt.fallback"));

  const link = $("p-link");
  if (p.url) { link.hidden = false; link.href = p.url; link.textContent = p.url; }
  else if (p.vnc_port) {
    link.hidden = false; link.removeAttribute("href");
    link.textContent = t("prompt.vnc", p.vnc_port);
  } else link.hidden = true;

  const input = $("p-input");
  input.value = "";
  input.placeholder = p.type === "url" ? "https://…" : "";
  input.type = p.type === "password" ? "password" : "text";
  $("veil").hidden = false;
  input.focus();

  clearInterval(renderPrompt.timer);
  const tick = () => {
    const left = Math.floor((new Date(p.expires_at) - Date.now()) / 1000);
    const box = $("p-expiry");
    if (!p.expires_at || isNaN(left)) { box.textContent = ""; return; }
    if (left <= 0) { box.textContent = t("prompt.expired"); box.className = "expiry soon"; return; }
    box.textContent = t("prompt.expires", duration(left));
    box.className = "expiry" + (left < 30 ? " soon" : "");
  };
  tick();
  renderPrompt.timer = setInterval(tick, 1000);
}

async function sendPrompt() {
  if (!shownPrompt) return;
  const value = $("p-input").value.trim();
  if (!value) { $("p-input").focus(); return; }
  $("p-send").disabled = true;
  try {
    await api("/api/prompts/" + encodeURIComponent(shownPrompt), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value }),
    });
    $("veil").hidden = true;
    shownPrompt = null;
  } catch (e) {
    $("p-why").textContent = e.message;
  } finally {
    $("p-send").disabled = false;
  }
}
$("p-send").addEventListener("click", sendPrompt);
$("p-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendPrompt(); });
$("p-skip").addEventListener("click", () => { $("veil").hidden = true; });

/* --- live updates -------------------------------------------------------- */
function connect() {
  const src = new EventSource("/api/events?token=" + encodeURIComponent(TOKEN));
  src.onmessage = (ev) => {
    $("offline").hidden = true;
    try { render(JSON.parse(ev.data)); } catch (_) {}
  };
  src.onerror = () => {
    $("offline").hidden = false;
    src.close();
    // The client may be restarting its routing engine; keep trying quietly.
    setTimeout(connect, 2000);
  };
}

applyLanguage();

if (!TOKEN) {
  document.body.textContent = t("notoken");
} else {
  api("/api/state").then((r) => r.json()).then(render).catch(() => {});
  connect();
}
</script>
